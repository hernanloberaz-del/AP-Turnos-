<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - AP Turnos</title>
    
    <!-- SDK Modular de Firebase v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Reemplazá esto con la configuración de tu proyecto en Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "ap-turnos.firebaseapp.com",
            projectId: "project-362178464205",
            storageBucket: "ap-turnos.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 1. Login con Email y Contraseña
        document.getElementById('btn-email').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, email, pass)
                .then(result => console.log("Éxito Correo:", result.user))
                .catch(error => alert("Error correo: " + error.message));
        });

        // 2. Login con Google
        document.getElementById('btn-google').addEventListener('click', () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then(result => console.log("Éxito Google:", result.user))
                .catch(error => alert("Error Google: " + error.message));
        });

        // 3. Login con Facebook
        document.getElementById('btn-facebook').addEventListener('click', () => {
            const provider = new FacebookAuthProvider();
            signInWithPopup(auth, provider)
                .then(result => console.log("Éxito Facebook:", result.user))
                .catch(error => alert("Error Facebook: " + error.message));
        });
    </script>
</head>
<body>
    <h2>Ingreso a AP Turnos</h2>
    
    <div>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="pass" placeholder="Contraseña">
        <button id="btn-email">Entrar con Correo</button>
    </div>
    
    <hr>
    
    <div>
        <button id="btn-google">Entrar con Google</button>
        <button id="btn-facebook">Entrar con Facebook</button>
    </div>
</body>
</html>
