<!DOCTYPE html>

<head>

    <script>
        const firebaseConfig = {

          authDomain: "ap-turnos.firebaseapp.com",
          projectId: "ap-turnos",

        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection("usuarios").doc(user.uid).get();
                if (!userDoc.exists || userDoc.data().rol !== "admin") {
                    alert("Acceso denegado.");
                    window.location.href = "deportes.html";
                } else {
                    document.getElementById("admin-email").innerText = user.email;
                    const hoy = new Date().toISOString().split('T')[0];
                    document.getElementById("input-fecha-admin").value = hoy;
                    cargarConfigAdmin(user.uid);
                }
            } else {
                window.location.href = "índice.html";
            }
        });

        async function cargarConfigAdmin(uid) {
            try {
                const doc = await db.collection("negocios").doc(uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById("deporte").value = data.deportePrincipal || "Pádel";
                    document.getElementById("hora-apertura").value = data.apertura || "08:00";
                    document.getElementById("hora-cierre").value = data.cierre || "23:00";
                    document.getElementById("duracion-turno").value = data.duracionMinutos || 90;
                    
                    const cantidadCanchas = data.canchas ? data.canchas.length : 4;
                    document.getElementById("cantidad-canchas").value = cantidadCanchas;
                }
                cargarGrillaAdmin();
            } catch (e) {
                console.error(e);
            }
        }
