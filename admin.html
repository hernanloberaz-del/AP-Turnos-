<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - AP Turnos</title>
    <!-- SDK Modular de Firebase v10 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px;">

    <div style="max-width: 1100px; margin: 0 auto;">
        <!-- Cabecera del Panel -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
            <div>
                <h1 style="color: #27ae60; margin: 0; font-size: 24px;">Panel de Administración</h1>
                <p id="info-usuario" style="color: #aaa; margin: 5px 0 0 0; font-size: 14px;">Cargando perfil...</p>
            </div>
            <button onclick="cerrarSesion()" style="background: #c0392b; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Cerrar Sesión</button>
        </div>

        <!-- Contenedor Modular según la Suscripción -->
        <div id="contenedor-modulos" style="display: flex; flex-direction: column; gap: 20px;">
            <p style="text-align: center; color: #888; padding: 40px;">Verificando permisos y plan activo...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBaIoJ6c7U1E_YGHDjuP3fXehqFOb-MqMY",
          authDomain: "ap-turnos.firebaseapp.com",
          projectId: "ap-turnos",
          storageBucket: "ap-turnos.firebasestorage.app",
          messagingSenderId: "362178464205",
          appId: "1:362178464205:web:48624c7ee600b8d8755c84",
          measurementId: "G-K7DTFN97VJ"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                const doc = await db.collection("usuarios").doc(user.uid).get();
                if (!doc.exists || doc.data().rol !== "admin") {
                    alert("Acceso denegado. No sos administrador.");
                    window.location.href = "deportes.html";
                    return;
                }

                const datos = doc.data();
                const plan = datos.plan || "sin_plan";
                
                document.getElementById("info-usuario").innerText = `Usuario: ${user.email} | Plan Activo: ${plan.toUpperCase()}`;

                renderizarModulos(plan);

            } catch (err) {
                console.error("Error al cargar el panel:", err);
            }
        });

        // Función que dibuja los módulos en pantalla según el plan contratado
        function renderizarModulos(plan) {
            const contenedor = document.getElementById("contenedor-modulos");
            contenedor.innerHTML = "";

            let htmlModulos = "";

            // 1. Módulo de Canchas (Disponible para canchas_basico y full_club)
            if (plan === "canchas_basico" || plan === "full_club") {
                htmlModulos += `
                    <div style="background: #1e1e1e; padding: 25px; border-radius: 8px; border-left: 5px solid #27ae60;">
                        <h2>🎾 Gestión de Canchas (Pádel / Fútbol)</h2>
                        <p style="color: #aaa; font-size: 14px;">Administrá las grillas horarias, reservas de los clientes y bloqueos de canchas en tiempo real.</p>
                        <div style="background: #2a2a2a; padding: 15px; border-radius: 5px; margin-top: 15px;">
                            <p style="margin: 0 0 12px 0; color: #27ae60; font-weight: bold;">[Grilla de Turnos Activa]</p>
                            <p style="margin: 0 0 15px 0; font-size: 13px; color: #ccc;">Seleccioná el deporte para gestionar los turnos de tu complejo:</p>
                            
                            <!-- Botones específicos para Fútbol y Pádel -->
                            <div style="display: flex; gap: 15px;">
                                <a href="deportes.html?deporte=futbol" style="background: #27ae60; color: white; padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block;">
                                    ⚽ Gestionar Fútbol
                                </a>
                                <a href="deportes.html?deporte=padel" style="background: #27ae60; color: white; padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block;">
                                    🎾 Gestionar Pádel
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 2. Módulo de Profesores / Clases (Disponible para profes_torneos y full_club)
            if (plan === "profes_torneos" || plan === "full_club") {
                htmlModulos += `
                    <div style="background: #1e1e1e; padding: 25px; border-radius: 8px; border-left: 5px solid #3498db;">
                        <h2>👨‍🏫 Panel de Profesores y Alumnos</h2>
                        <p style="color: #aaa; font-size: 14px;">Control de agendas de clases, cupos de alumnos y horarios de entrenamiento personalizados.</p>
                        <div style="background: #2a2a2a; padding: 15px; border-radius: 5px; margin-top: 15px;">
                            <p style="margin: 0 0 12px 0; color: #3498db; font-weight: bold;">[Agenda de Clases Activa]</p>
                            <p style="margin: 0 0 15px 0; font-size: 13px; color: #ccc;">Gestión de turnos fijos y asistencia de alumnos.</p>
                            
                            <!-- Botón de acceso al panel de profes -->
                            <a href="deportes.html?modulo=profesores" style="background: #3498db; color: white; padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block;">
                                📅 Abrir Grilla de Profesores
                            </a>
                        </div>
                    </div>
                `;
            }

            // 3. Módulo de Torneos (Disponible para profes_torneos y full_club)
            if (plan === "profes_torneos" || plan === "full_club") {
                htmlModulos += `
                    <div style="background: #1e1e1e; padding: 25px; border-radius: 8px; border-left: 5px solid #e67e22;">
                        <h2>🏆 Organización de Torneos</h2>
                        <p style="color: #aaa; font-size: 14px;">Generación de zonas, cuadros de eliminación directa y programación de partidos de torneo.</p>
                        <div style="background: #2a2a2a; padding: 15px; border-radius: 5px; margin-top: 15px;">
                            <p style="margin: 0 0 12px 0; color: #e67e22; font-weight: bold;">[Módulo de Competencia Activo]</p>
                            <p style="margin: 0 0 15px 0; font-size: 13px; color: #ccc;">Creación de fixtures y carga de resultados por categoría.</p>
                            
                            <!-- Botón de acceso a torneos -->
                            <a href="deportes.html?modulo=torneos" style="background: #e67e22; color: white; padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block;">
                                🏆 Administrar Torneos
                            </a>
                        </div>
                    </div>
                `;
            }

            if (htmlModulos === "") {
                htmlModulos = `
                    <div style="background: #1e1e1e; padding: 30px; border-radius: 8px; text-align: center;">
                        <p style="color: #e74c3c;">No tenés ningún plan activo habilitado.</p>
                        <a href="suscripciones.html" style="color: #3498db; text-decoration: underline;">Elegir una suscripción</a>
                    </div>
                `;
            }

            contenedor.innerHTML = htmlModulos;
        }

        function cerrarSesion() {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        }
    </script>
</body>
</html>
